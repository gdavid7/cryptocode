name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build twine
      - run: python -m build --outdir artifacts
      - run: python -m twine check artifacts/*
      - name: Install wheel built from source distribution
        run: python -m pip install --no-index --find-links artifacts cryptocode --no-deps
      - run: python -m pip install "pycryptodomex>=3.24.0"
      - run: python -m pip check
      - name: Test installed package outside repository root
        working-directory: tests
        run: python -m unittest discover -v
